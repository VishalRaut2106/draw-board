<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="chalkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundRect">
      <rect width="100" height="100" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <!-- Dark chalkboard background -->
  <rect width="100" height="100" rx="22" ry="22" fill="#1a1a2e"/>
  <!-- Subtle texture overlay -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#noise)" opacity="0.05"/>

  <!-- Chalk S path -->
  <path
    d="M 62,28
       C 62,28 34,22 28,36
       C 22,50 48,53 52,57
       C 56,61 66,66 60,76
       C 54,86 26,80 26,80"
    fill="none"
    stroke="url(#chalkGrad)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
    opacity="0.95"
  />
</svg>